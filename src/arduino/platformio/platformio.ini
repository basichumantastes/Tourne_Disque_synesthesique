[env:uno]
platform = atmelavr
board = uno
framework = arduino

; Configuration série
monitor_speed = 9600

; Bibliothèques communes
lib_deps =
    fastled/FastLED@^3.6.0

[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 9600

; Configuration de build
build_flags =
    -D SERIAL_DEBUG
    -D BAUD_RATE=9600